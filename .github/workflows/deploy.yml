# Builds and deploys to GitHub Pages on every push to main.
#
# Base path handling: when public/CNAME exists the site serves from a
# custom domain root, so VITE_BASE is "/". Without a CNAME the site
# serves from https://<user>.github.io/<repo>/, so VITE_BASE is the
# repo subpath. To move a copy of this app to a custom domain, add the
# domain to public/CNAME and configure the domain in the repo's Pages
# settings. Nothing else changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set base path
        run: |
          if [ -f public/CNAME ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
